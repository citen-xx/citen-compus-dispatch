server:
  port: 8082

spring:
  application:
    name: order-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:citen_dp}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.citen.entity
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    com.citen: debug

reservation:
  confirm-timeout-seconds: ${RESERVATION_CONFIRM_TIMEOUT_SECONDS:900}
  recovery-interval-ms: ${RESERVATION_RECOVERY_INTERVAL_MS:60000}
  compensation-interval-ms: ${RESERVATION_COMPENSATION_INTERVAL_MS:30000}
